<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Elite AI</title>
<style>
:root{--g:#d4af6a;--bg:#07070a;--t:#e9e6df;--m:#8d8a84}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--t);font:17px/1.7 -apple-system,"Segoe UI",Inter,sans-serif;overflow-x:hidden}
.intro{position:fixed;inset:0;background:#000;display:grid;place-items:center;z-index:9;animation:out 1s 2.6s forwards}
.intro h1{font-weight:200;letter-spacing:.5em;font-size:clamp(28px,6vw,72px);background:linear-gradient(90deg,#6b5a35,var(--g),#fff4d6,var(--g),#6b5a35);background-size:300%;-webkit-background-clip:text;color:transparent;animation:sh 2.6s ease,in 1.6s ease}
.ring{position:absolute;width:20px;height:20px;border:1px solid var(--g);border-radius:50%;animation:rg 2.4s ease-out forwards}
@keyframes in{from{opacity:0;letter-spacing:1.5em;filter:blur(12px)}}@keyframes sh{from{background-position:100%}}
@keyframes rg{to{width:160vmax;height:160vmax;opacity:0}}@keyframes out{to{opacity:0;visibility:hidden}}
nav{position:sticky;top:0;z-index:50;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:16px 6vw;color:var(--m);font-size:14px;letter-spacing:.2em}
nav b{color:var(--g);font-weight:400}button{background:none;border:1px solid #333;color:var(--t);padding:6px 14px;border-radius:20px;cursor:pointer}
section{max-width:900px;margin:0 auto;padding:12vh 6vw}
.hero{text-align:center;padding-top:16vh}.hero h2{font-size:clamp(36px,6vw,68px);font-weight:300;line-height:1.15}
.hero h2 span{color:var(--g)}.hero p{color:var(--m);max-width:620px;margin:28px auto 0}
h3{color:var(--g);font-weight:400;letter-spacing:.25em;font-size:13px;text-transform:uppercase;margin-bottom:18px}
h4{font-size:30px;font-weight:300;margin-bottom:16px}.m{color:var(--m)}
.tag{display:inline-block;border:1px solid #4a3f28;color:var(--g);font-size:12px;padding:3px 10px;border-radius:12px;margin-bottom:14px}
.wave{display:flex;gap:5px;height:70px;align-items:center;margin:30px 0}.wave i{flex:1;background:linear-gradient(var(--g),#5a4a2a);border-radius:3px;animation:w 1.3s ease-in-out infinite}
@keyframes w{0%,100%{height:12%}50%{height:100%}}
svg{width:100%;height:auto;margin-top:26px}.fl{stroke-dasharray:6 8;animation:d 1.2s linear infinite}@keyframes d{to{stroke-dashoffset:-28}}
.node rect{fill:#121216;stroke:#3a3226}.node text{fill:var(--t);font-size:13px;text-anchor:middle}.lake rect{stroke:var(--g)}
.p{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:26px 0}.p div{border:1px solid #222;border-radius:14px;padding:22px;background:#0d0d10}
.p b{display:block;font-size:30px;font-weight:300;color:var(--g)}@media(max-width:640px){.p{grid-template-columns:1fr}}
.r{opacity:0;transform:translateY(40px);transition:1s}.r.v{opacity:1;transform:none}
footer{text-align:center;color:#555;font-size:13px;padding:60px 6vw}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:26px}.cards div{border:1px solid #222;border-radius:14px;padding:22px;background:#0d0d10}.cards b{display:block;color:var(--g);font-weight:400;margin-bottom:8px}@media(max-width:640px){.cards{grid-template-columns:1fr}}
.btn{border-color:var(--g);color:var(--g);padding:12px 26px;font-size:15px;margin:8px 6px 0 0}.btn:hover{background:var(--g);color:#000}.btn:disabled{opacity:.4;cursor:not-allowed}
audio{width:100%;margin-top:18px;filter:invert(.9) sepia(.4)}

.ann{display:inline-block;border:1px solid #4a3f28;color:var(--g);font-size:12px;padding:4px 14px;border-radius:14px;margin-bottom:22px;letter-spacing:.15em}
body.light{--bg:#f6f3ec;--t:#1c1b18;--m:#5f5a50;--g:#9a7430}
body.light nav{background:rgba(246,243,236,.9)}body.light button{border-color:#c9c0ad}

<div class="intro"><div class="ring"></div><h1>ELITE&nbsp;AI</h1></div>
<nav><b>ELITE AI</b><span><button id="call" class="btn" style="padding:10px 20px;margin:0 8px 0 0;font-weight:600;background:#1f9d55;border-color:#1f9d55;color:#fff" data-ru="Включить" data-en="Turn on"></button><button id="off" class="btn" style="padding:10px 20px;margin:0 8px 0 0;font-weight:600;background:#c0392b;border-color:#c0392b;color:#fff" data-ru="Отключить" data-en="Turn off"></button><button id="th" title="Тема">☀</button><button id="lg">EN</button></span></nav>
<section class="hero"><span class="ann" data-ru="АНОНС ПЛАТФОРМЫ" data-en="PLATFORM ANNOUNCEMENT"></span>
<h2 data-ru="Личный ИИ ассистент <span>для тех, кто ведёт бизнес</span>" data-en="A personal AI assistant <span>for people who run businesses</span>"></h2>
<p class="m" data-ru="Elite AI задуман как ассистент, который будет жить на вашем собственном домене, помнить ваши дела и однажды возьмёт на себя переписку, звонки и рутину так, как это делал бы надёжный сотрудник. Сейчас мы рассказываем о платформе, которую строим, и честно показываем, что из неё уже существует в коде." data-en="Elite AI is conceived as an assistant that will live on your own domain, remember your affairs and one day take over correspondence, calls and routine the way a trusted employee would. Here we describe the platform we are building and show honestly what already exists in code."></p></section>
<section class="r"><h3 data-ru="Возможности" data-en="Capabilities"></h3><h4 data-ru="Один ассистент, один контур" data-en="One assistant, one contour"></h4>
<p class="m" data-ru="Мы проектируем Elite AI так, чтобы телефон и компьютер стали для него единым пространством, а разговор, начатый утром в дороге, спокойно продолжался вечером за ноутбуком." data-en="We are designing Elite AI so that phone and computer become a single space for it, and a conversation started in the morning on the road continues calmly in the evening at the laptop."></p>
<div class="cards"><div><b data-ru="Единый контур" data-en="Single contour"></b><p class="m" data-ru="Телефон и компьютер связаны в одну рабочую среду ассистента." data-en="Phone and computer joined into one working environment."></p></div>
<div><b data-ru="Память контекста" data-en="Context memory"></b><p class="m" data-ru="Ассистент будет помнить, о чём шла речь, от сессии к сессии." data-en="The assistant will remember what was discussed from session to session."></p></div>
<div><b data-ru="Файлы, почта, браузер, мессенджеры" data-en="Files, mail, browser, messengers"></b><p class="m" data-ru="Работа там, где на самом деле идут ваши дела." data-en="Working where your affairs actually happen."></p></div>
<div><b data-ru="Звонки и переписка" data-en="Calls and correspondence"></b><p class="m" data-ru="Со временем ассистент сможет звонить и писать людям от вашего имени в рамках выданных вами прав." data-en="In time it will call and write to people on your behalf within the rights you grant."></p></div></div></section>
<section class="r"><h3 data-ru="Сценарий" data-en="Scenario"></h3><h4 data-ru="«Здравствуйте, я ассистент Анатолия Петровича»" data-en="“Hello, I am Anatoly Petrovich’s assistant”"></h4><p class="m" data-ru="Владелец заводит новый номер WhatsApp и подключает к нему своего робота. Робот звонит коллегам и знакомым, договаривается о доставке, встрече или подписании контракта и напоминает о визите в офис. Ассистент помнит весь разговор, всё расшифровывается в текст, и он может собрать конференцию или видеоконференцию." data-en="The owner gets a new WhatsApp number and connects his robot to it. The robot calls colleagues and friends, arranges a delivery, a meeting or a contract signing and reminds them of an office visit. The assistant remembers the whole conversation, everything is transcribed, and it can set up a conference or video conference."></p></section>
<section class="r"><h3 data-ru="Уникальность" data-en="What sets it apart"></h3><h4 data-ru="Своя CRM, свои кабинеты, своя модель" data-en="Own CRM, own cabinets, own model"></h4><p class="m" data-ru="В платформу встроена собственная CRM и система кабинетов, где у каждого аккаунта свой кабинет. Ключевая уникальность в отделённой, изолированной модели для каждого клиента." data-en="The platform has its own built in CRM and a cabinet system in which every account has its own cabinet. The key distinction is a separate, isolated model for each client."></p></section>
<section class="r"><h3 data-ru="Как это устроено" data-en="How it works"></h3><h4 data-ru="Клон под каждого клиента" data-en="A clone for every client"></h4><p class="m" data-ru="Клиент оплачивает лицензию, автоматика регистрирует аккаунт на его собственном домене, купленном у его регистратора, и передаёт ему робота. Дальше владелец сам работает со своим роботом и настраивает его под себя." data-en="The client pays for a licence, automation registers the account on his own domain bought from his registrar and hands over his robot. From then on the owner works with his robot and configures it himself."></p></section>
<section class="r"><h3 data-ru="Защита" data-en="Protection"></h3><h4 data-ru="Атака не выходит за пределы одного клиента" data-en="An attack stays within one client"></h4><p class="m" data-ru="Каждый экземпляр живёт отдельно, поэтому кибератака может затронуть только одного клиента, а система в целом не подставляется." data-en="Every instance lives separately, so a cyberattack can affect only one client while the system as a whole stays unexposed."></p></section>
<section class="r"><h3 data-ru="Уже в коде" data-en="Already in code"></h3><h4 data-ru="Мессенджер на Signal Protocol" data-en="A messenger on the Signal Protocol"></h4>
<p class="m" data-ru="Единственная часть, которая уже написана, это собственный мессенджер на официальной библиотеке Signal со сквозным шифрованием. Сервер хранит только шифротекст и не может прочитать переписку." data-en="The one part already written is our own messenger built on the official Signal library with end to end encryption. The server stores only ciphertext and cannot read conversations."></p></section>
<section class="r"><h3 data-ru="Следующий шаг" data-en="Next step"></h3><h4 data-ru="Telegram, WhatsApp и почта" data-en="Telegram, WhatsApp and email"></h4>
<p class="m" data-ru="Подключение привычных каналов стоит в плане следующим этапом, чтобы ассистент встречал ваших собеседников там, где они уже общаются." data-en="Connecting familiar channels is planned as the next stage, so the assistant meets your contacts where they already talk."></p></section>
<section class="r"><h3 data-ru="Модели" data-en="Models"></h3><h4 data-ru="Шлюз LiteLLM" data-en="The LiteLLM gateway"></h4>
<p class="m" data-ru="Запросы будут проходить через шлюз LiteLLM. Основной моделью задумана DeepSeek, запасной Mistral, обе на собственных серверах, а для сложных рассуждений предусмотрена премиальная модель. Сейчас шлюз существует в коде как заготовка." data-en="Requests will pass through a LiteLLM gateway. DeepSeek is planned as the main model and Mistral as the fallback, both on our own servers, with a premium model for complex reasoning. Today the gateway exists in code as a stub."></p></section>
<section class="r"><h3 data-ru="Хранение" data-en="Storage"></h3><h4 data-ru="PostgreSQL и изоляция клиентов" data-en="PostgreSQL and client isolation"></h4>
<p class="m" data-ru="Рабочая база построена на PostgreSQL, и каждый клиент изолирован на уровне строк, поэтому данные одного владельца недоступны другому." data-en="The working database is PostgreSQL, and every client is isolated at row level, so one owner's data is unavailable to another."></p></section>
<section class="r"><h3 data-ru="Партнёрский модуль" data-en="Partner module"></h3><h4 data-ru="Голос, который слышит эмоции" data-en="A voice that hears emotion"></h4><div class="wave" id="wv"></div>
<p class="m" data-ru="Команда Якова три с половиной года вместе с МГУ разрабатывала голосовой модуль, который понимает эмоции и контекст речи. Это партнёрская технология, и её интеграция в Elite AI только планируется." data-en="Yakov's team spent three and a half years with Moscow State University building a voice module that understands emotion and context in speech. It is partner technology, and its integration into Elite AI is planned."></p></section>
<section class="r"><h3 data-ru="Лицензия" data-en="Licence"></h3><h4 data-ru="От $300 до $900 в месяц" data-en="From $300 to $900 a month"></h4><div class="p"><div>Private<b>$300</b><span class="m" data-ru="в месяц" data-en="per month"></span></div><div>Signature<b>$600</b><span class="m" data-ru="в месяц" data-en="per month"></span></div><div>Sovereign<b>$900</b><span class="m" data-ru="в месяц" data-en="per month"></span></div></div></section>
<section class="r"><h3 data-ru="Послушайте ассистента" data-en="Listen to the assistant"></h3><h4 data-ru="Рассказ о платформе голосом" data-en="The platform, told by voice"></h4>
<p class="m" data-ru="Две записи на русском языке, в которых ассистент сам рассказывает обо всём, что есть на этой странице. Голоса синтезированы и служат образцом звучания." data-en="Two Russian recordings in which the assistant tells about everything on this page. The voices are synthesized samples."></p>
<button class="btn" data-a="audio/female.mp3" data-ru="Женский голос" data-en="Female voice"></button><button class="btn" data-a="audio/male.mp3" data-ru="Мужской голос" data-en="Male voice"></button>
<audio id="pl" controls preload="none"></audio></section>
<section class="r"><h3 data-ru="Живой разговор" data-en="Live conversation"></h3><h4 data-ru="Поговорите с ассистентом" data-en="Talk to the assistant"></h4>
<p class="m" data-ru="Нажмите «Включить», разрешите микрофон и говорите. Ключи и регистрация не нужны. Лучше всего работает в Chrome, Edge и Safari." data-en="Press “Turn on”, allow the microphone and talk. No keys or sign up needed. Works best in Chrome, Edge and Safari."></p>
<button class="btn" id="call2" data-ru="Позвонить ассистенту" data-en="Call the assistant"></button></section>
<section class="r"><h3 data-ru="Контакты" data-en="Contacts"></h3><h4 data-ru="Компания Elite" data-en="Elite"></h4><p class="m" data-ru="Владелец проекта Арсен Одабашян." data-en="Project owner Arsen Odabashyan."></p><p class="m" data-ru="Представитель Мариус Едлицкий, Elite Icon FZ‑LLC, <a style=&quot;color:var(--g)&quot; href=&quot;https://www.eipinvestment.com&quot;>eipinvestment.com</a>, <a style=&quot;color:var(--g)&quot; href=&quot;tel:+971585397733&quot;>+971 58 539 7733</a>." data-en="Representative Marius Jedlickij, Elite Icon FZ‑LLC, <a style=&quot;color:var(--g)&quot; href=&quot;https://www.eipinvestment.com&quot;>eipinvestment.com</a>, <a style=&quot;color:var(--g)&quot; href=&quot;tel:+971585397733&quot;>+971 58 539 7733</a>."></p></section>

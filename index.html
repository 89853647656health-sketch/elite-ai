<style>
:root{--g:#d4af6a;--bg:#07070a;--t:#e9e6df;--m:#8d8a84}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--t);font:17px/1.7 -apple-system,"Segoe UI",Inter,sans-serif;overflow-x:hidden}
.intro{position:fixed;inset:0;background:#000;display:grid;place-items:center;z-index:9;animation:out 1s 2.6s forwards}
.intro h1{font-weight:200;letter-spacing:.5em;font-size:clamp(28px,6vw,72px);background:linear-gradient(90deg,#6b5a35,var(--g),#fff4d6,var(--g),#6b5a35);background-size:300%;-webkit-background-clip:text;color:transparent;animation:sh 2.6s ease,in 1.6s ease}
.ring{position:absolute;width:20px;height:20px;border:1px solid var(--g);border-radius:50%;animation:rg 2.4s ease-out forwards}
@keyframes in{from{opacity:0;letter-spacing:1.5em;filter:blur(12px)}}@keyframes sh{from{background-position:100%}}
@keyframes rg{to{width:160vmax;height:160vmax;opacity:0}}@keyframes out{to{opacity:0;visibility:hidden}}
nav{position:sticky;top:0;z-index:50;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:16px 6vw;color:var(--m);font-size:14px;letter-spacing:.2em}
nav b{color:var(--g);font-weight:400}button{background:none;border:1px solid #333;color:var(--t);padding:6px 14px;border-radius:20px;cursor:pointer}
section{max-width:900px;margin:0 auto;padding:12vh 6vw}
.hero{text-align:center;padding-top:16vh}.hero h2{font-size:clamp(36px,6vw,68px);font-weight:300;line-height:1.15}
.hero h2 span{color:var(--g)}.hero p{color:var(--m);max-width:680px;margin:28px auto 0}section .m+.m{margin-top:16px}
h3{color:var(--g);font-weight:400;letter-spacing:.25em;font-size:13px;text-transform:uppercase;margin-bottom:18px}
h4{font-size:30px;font-weight:300;margin-bottom:16px}.m{color:var(--m)}
.tag{display:inline-block;border:1px solid #4a3f28;color:var(--g);font-size:12px;padding:3px 10px;border-radius:12px;margin-bottom:14px}
.wave{display:flex;gap:5px;height:70px;align-items:center;margin:30px 0}.wave i{flex:1;background:linear-gradient(var(--g),#5a4a2a);border-radius:3px;animation:w 1.3s ease-in-out infinite}
@keyframes w{0%,100%{height:12%}50%{height:100%}}
svg{width:100%;height:auto;margin-top:26px}.fl{stroke-dasharray:6 8;animation:d 1.2s linear infinite}@keyframes d{to{stroke-dashoffset:-28}}
.node rect{fill:#121216;stroke:#3a3226}.node text{fill:var(--t);font-size:13px;text-anchor:middle}.lake rect{stroke:var(--g)}
.p{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:26px 0}.p div{border:1px solid #222;border-radius:14px;padding:22px;background:#0d0d10}
.p b{display:block;font-size:30px;font-weight:300;color:var(--g)}@media(max-width:640px){.p{grid-template-columns:1fr}}
.r{opacity:0;transform:translateY(40px);transition:1s}.r.v{opacity:1;transform:none}
footer{text-align:center;color:#555;font-size:13px;padding:60px 6vw}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:26px}.cards div{border:1px solid #222;border-radius:14px;padding:22px;background:#0d0d10}.cards b{display:block;color:var(--g);font-weight:400;margin-bottom:8px}@media(max-width:640px){.cards{grid-template-columns:1fr}}
.btn{border-color:var(--g);color:var(--g);padding:12px 26px;font-size:15px;margin:8px 6px 0 0}.btn:hover{background:var(--g);color:#000}.btn:disabled{opacity:.4;cursor:not-allowed}
audio{width:100%;margin-top:18px;filter:invert(.9) sepia(.4)}
.modal{position:fixed;inset:0;background:#000c;display:none;place-items:center;z-index:20}.modal.on{display:grid}.box{background:#0d0d10;border:1px solid #3a3226;border-radius:16px;padding:28px;width:min(460px,92vw)}
.box input{width:100%;background:#000;border:1px solid #333;color:var(--t);padding:10px;border-radius:8px;margin:14px 0}#st{color:var(--g);min-height:1.7em;font-size:14px}
.ann{display:inline-block;border:1px solid #4a3f28;color:var(--g);font-size:12px;padding:4px 14px;border-radius:14px;margin-bottom:22px;letter-spacing:.15em}
body.light{--bg:#f6f3ec;--t:#1c1b18;--m:#5f5a50;--g:#9a7430}
body.light nav{background:rgba(246,243,236,.9)}body.light button{border-color:#c9c0ad}
body.light .p div,body.light .cards div,body.light .box,body.light .node rect{background:#fff;fill:#fff;border-color:#e2dccd}
body.light .box input{background:#fff}body.light audio{filter:none}body.light .btn:hover{color:#fff}
</style></head><body>
<div class="intro"><div class="ring"></div><h1>ELITE&nbsp;AI</h1></div>
<nav><b>ELITE AI</b><span><button id="call" class="btn" style="padding:10px 20px;margin:0 8px 0 0;font-weight:600;background:#1f9d55;border-color:#1f9d55;color:#fff" data-ru="Включить" data-en="Turn on"></button><button id="off" class="btn" style="padding:10px 20px;margin:0 8px 0 0;font-weight:600;background:#c0392b;border-color:#c0392b;color:#fff" data-ru="Отключить" data-en="Turn off"></button><button id="th" title="Тема">☀</button><button id="lg">EN</button></span></nav>
<section class="hero"><span class="ann" data-ru="ДЕМО ВЕРСИЯ · ЗАПУСК В НОЯБРЕ" data-en="DEMO VERSION · LAUNCH IN NOVEMBER"></span>
<h2 data-ru="Персональный интеллектуальный ассистент &lt;span&gt;премиум класса&lt;/span&gt;" data-en="A premium class &lt;span&gt;personal intelligent assistant&lt;/span&gt;"></h2>
<p class="m" data-ru="Elite AI это не чат бот и не очередной сервис по подписке. Это личный цифровой сотрудник владельца бизнеса, который работает на его собственном домене, на его устройствах и только на него. Продукт создан не для массового рынка, а для людей, чьё время стоит дорого: собственников, инвесторов, руководителей." data-en="Elite AI is not a chatbot and not yet another subscription service. It is a business owner’s personal digital employee that works on the owner’s own domain, on the owner’s devices and for the owner alone. The product is built not for the mass market but for people whose time is expensive: owners, investors, executives."></p>
<p class="m" style="margin-top:14px" data-ru="Компания Elite, основатели Мариус и Арсен, юридическое лицо в ОАЭ. Сейчас работает демо версия, запуск запланирован на ноябрь." data-en="Elite is a company founded by Marius and Arsen, with a legal entity in the UAE. This is a demo version, and launch is planned for November."></p>
<button class="btn" onclick="document.getElementById('call').click()" style="margin-top:28px" data-ru="Поговорить с ассистентом" data-en="Talk to the assistant"></button></section>
<section class="r"><h3 data-ru="В чём сила" data-en="Where its strength lies"></h3><h4 data-ru="Оркестр моделей и сотрудник, который помнит всё" data-en="An orchestra of models and an employee who remembers everything"></h4><p class="m" data-ru="Elite AI построен как оркестр. Внутри работают от пяти до пятидесяти моделей искусственного интеллекта, и система сама решает, какую из них подключить к конкретной задаче: одну для рассуждений, другую для текста, третью для поиска и анализа. Клиент не выбирает модели и не разбирается в них, он просто говорит с ассистентом." data-en="Elite AI is built like an orchestra. Inside, five to fifty artificial intelligence models work together, and the system itself decides which one to bring to a given task: one for reasoning, another for text, a third for search and analysis. The client does not choose models or need to understand them; they simply talk to the assistant."></p><p class="m" data-ru="У каждого ассистента своя CRM система с человеческим лицом. Она хранит людей, сделки, договорённости и все дела производства, а ассистент сам ведёт их: звонит людям, представляясь помощником владельца, пишет сообщения, готовит документы, напоминает и контролирует сроки. По сути владелец получает сотрудника, который помнит всё и не устаёт." data-en="Every assistant has its own CRM with a human face. It holds people, deals, agreements and all operational matters, and the assistant runs them itself: it calls people introducing itself as the owner’s assistant, writes messages, prepares documents, sends reminders and keeps track of deadlines. In effect the owner gets an employee who remembers everything and never tires."></p><p class="m" data-ru="Ассистент получает доступ к ноутбуку и другим устройствам владельца. Именно это превращает его из собеседника в исполнителя: он открывает файлы, работает с документами и выполняет поручения на реальной технике клиента." data-en="The assistant gets access to the owner’s laptop and other devices. That is what turns it from a conversation partner into a doer: it opens files, works with documents and carries out tasks on the client’s real hardware."></p><p class="m" data-ru="Связь с ассистентом идёт через собственный защищённый мессенджер на протоколе Signal, том же, которым защищены Signal и WhatsApp. Сервер хранит только зашифрованные сообщения и не может их прочитать. Владелец звонит своему ассистенту как обычному человеку и говорит с ним голосом." data-en="Communication with the assistant runs through its own secure messenger on the Signal protocol, the same one that protects Signal and WhatsApp. The server stores only encrypted messages and cannot read them. The owner calls the assistant like an ordinary person and talks to it by voice."></p></section>
<section class="r"><h3 data-ru="Уникальность модели" data-en="What makes the model unique"></h3><h4 data-ru="Свой экземпляр на своём домене" data-en="Your own instance on your own domain"></h4><p class="m" data-ru="Каждый клиент получает не учётную запись в общем сервисе, а свой отдельный экземпляр системы на своём домене. Его данные, ключи и память изолированы от других клиентов. Ассистент работает на клиента по лицензии." data-en="Each client receives not an account in a shared service but a separate instance of the system on their own domain. Their data, keys and memory are isolated from other clients. The assistant works for the client under a licence."></p><p class="m" data-ru="Есть два пути владения. Первый это подписка на одном из трёх уровней. Второй это выкуп платформы: после выкупа первый год обслуживания и обновлений бесплатный, затем 50 долларов в месяц." data-en="There are two paths to ownership. The first is a subscription at one of three tiers. The second is buying out the platform: after the buyout the first year of service and updates is free, then 50 dollars a month."></p><div class="p"><div>Private<b>$300</b><span class="m" data-ru="в месяц" data-en="per month"></span></div><div>Signature<b>$600</b><span class="m" data-ru="в месяц" data-en="per month"></span></div><div>Sovereign<b>$900</b><span class="m" data-ru="в месяц" data-en="per month"></span></div></div><p class="m" data-ru="Продукт не привязан к законам одной страны и рассчитан на работу в любой точке мира." data-en="The product is not tied to the laws of any single country and is designed to work anywhere in the world."></p></section>
<section class="r"><h3 data-ru="Безопасность и контроль" data-en="Security and control"></h3><h4 data-ru="Проверяемые гарантии вместо пустых обещаний" data-en="Verifiable guarantees instead of empty promises"></h4><p class="m" data-ru="Мы сознательно не называем систему невзламываемой. Вместо пустых обещаний заложены проверяемые гарантии: изоляция каждого клиента, шифрование ключей, неизменяемый журнал всех действий ассистента и аварийный выключатель. Деньги, платежи и звонки ассистент не проводит без подтверждения владельца. Права выдаются постепенно: сначала ассистент только читает, затем владелец сам открывает ему новые возможности с порогами по суммам." data-en="We deliberately do not call the system unhackable. Instead of empty promises it has verifiable guarantees built in: isolation of every client, key encryption, an immutable log of all the assistant’s actions and a kill switch. The assistant does not move money, make payments or place calls without the owner’s confirmation. Permissions are granted gradually: at first the assistant can only read, then the owner personally opens new capabilities with amount thresholds."></p></section>
<section class="r"><h3 data-ru="Что уже сделано" data-en="What has been done"></h3><h4 data-ru="Исследование, техническое задание и первая фаза кода" data-en="Research, a technical specification and the first phase of code"></h4><p class="m" data-ru="Проведено глобальное исследование рынка и конкурентов объёмом 72 страницы, а также разобран продукт BOB, который 22 октября 2026 года привлёк 5,5 миллиона долларов на схожей идее финансового AI сотрудника. Это подтверждает спрос на рынке. Подготовлено техническое задание. Исследован рынок доменов для массового размещения клиентских экземпляров." data-en="A 72 page global study of the market and competitors has been carried out, and the product BOB, which on 22 October 2026 raised 5.5 million dollars on a similar idea of a financial AI employee, has been analysed. This confirms market demand. A technical specification has been prepared. The domain market has been researched for hosting client instances at scale."></p><p class="m" data-ru="Написана первая фаза кода платформы на TypeScript. В ней работают защищённый мессенджер на официальной библиотеке Signal, изоляция клиентов, шифрование ключей, журнал действий, три тарифа, ядро CRM, подключение к ноутбуку с привязкой устройства и ограниченными правами, маршрутизатор моделей и аварийный выключатель. Все 17 автоматических тестов проходят, проверки на утечки секретов и уязвимости чистые." data-en="The first phase of the platform code has been written in TypeScript. It includes a working secure messenger on the official Signal library, client isolation, key encryption, an action log, three tiers, the CRM core, laptop connection with device binding and limited permissions, a model router and a kill switch. All 17 automated tests pass, and the scans for leaked secrets and vulnerabilities are clean."></p></section>
<section class="r"><h3 data-ru="В какой стадии проект" data-en="Where the project stands"></h3><h4 data-ru="Рабочий фундамент, а не готовый продукт" data-en="A working foundation, not a finished product"></h4><p class="m" data-ru="Честно: это рабочий фундамент, а не готовый продукт для продажи. Голосовые звонки, встречи, связь между экземплярами клиентов, подключение собственного домена и реальные модели ИИ пока стоят заглушками и идут следующим этапом. Дальше по плану подключение моделей, хранилище ключей, приложение для компьютера и голосовая связь. Следующими в продукт войдут модуль счетов и оплаты прямо в переписке, первый платёжный провайдер Ziina для ОАЭ, и независимый аудит безопасности кода." data-en="To be honest, this is a working foundation, not a finished product ready for sale. Voice calls, meetings, communication between client instances, custom domain connection and real AI models are still placeholders and come in the next stage. The plan continues with connecting the models, a key vault, a desktop application and voice communication. Next into the product come an invoicing and payment module right inside the chat, Ziina as the first payment provider for the UAE, and an independent security audit of the code."></p></section>
<section class="r"><h3 data-ru="Что нужно проекту" data-en="What the project needs"></h3><h4 data-ru="Следующий шаг" data-en="The next step"></h4><p class="m" data-ru="Финансирование команды на доведение до первых платящих клиентов, юридическая проверка лицензии библиотеки Signal для распространения и регистрация товарного знака." data-en="Funding for the team to reach the first paying clients, a legal review of the Signal library licence for distribution, and trademark registration."></p></section>
<section class="r"><h3 data-ru="Живой разговор" data-en="Live conversation"></h3><h4 data-ru="Поговорите с ассистентом" data-en="Talk to the assistant"></h4>
<p class="m" data-ru="Нажмите «Включить», разрешите микрофон и говорите. Ключи и регистрация не нужны. Лучше всего работает в Chrome, Edge и Safari." data-en="Press “Turn on”, allow the microphone and talk. No keys or sign up needed. Works best in Chrome, Edge and Safari."></p>
<button class="btn" id="call2" data-ru="Включить" data-en="Turn on"></button></section>
<section class="r"><h3 data-ru="Контакты" data-en="Contacts"></h3><h4 data-ru="Компания Elite" data-en="Elite"></h4><p class="m" data-ru="Основатели Мариус и Арсен. Юридическое лицо зарегистрировано в Объединённых Арабских Эмиратах." data-en="Founders Marius and Arsen. The legal entity is registered in the United Arab Emirates."></p></section>

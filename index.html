<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Elite AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef4ff;--bg2:#dfeaff;--ink:#0d1630;--m:#4d6286;--acc:#1d5bff;--acc2:#6f9bff;--glass:rgba(255,255,255,.55);--gb:rgba(255,255,255,.85);--line:rgba(80,130,220,.2);--sh:0 10px 30px rgba(30,80,170,.10),0 2px 6px rgba(30,80,170,.06)}
body.dark{--bg:#070b16;--bg2:#0d1630;--ink:#eaf0ff;--m:#93a5c8;--acc:#5b8cff;--acc2:#8fb0ff;--glass:rgba(20,30,58,.55);--gb:rgba(120,160,255,.18);--line:rgba(120,160,255,.18);--sh:0 10px 30px rgba(0,0,0,.35)}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth}
body{font:16px/1.65 Manrope,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(1200px 700px at 85% -10%,var(--bg2),transparent 60%),radial-gradient(900px 600px at -10% 30%,var(--bg2),transparent 60%),var(--bg);min-height:100vh;overflow-x:hidden;transition:background .4s,color .4s}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(115deg,transparent 0 120px,rgba(255,255,255,.18) 121px,transparent 240px);opacity:.5;z-index:-1}
body.dark:before{opacity:.06}
.glass{background:var(--glass);border:1px solid var(--gb);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);box-shadow:var(--sh);border-radius:22px}
header{position:sticky;top:14px;z-index:50;margin:14px auto 0;width:min(1180px,94vw);display:flex;align-items:center;gap:18px;padding:10px 14px 10px 20px;border-radius:20px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.06em;color:var(--ink);text-decoration:none;white-space:nowrap}
.mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--acc),#7b5bff);display:grid;place-items:center;color:#fff;font-size:15px;font-weight:800;box-shadow:0 6px 16px rgba(29,91,255,.35)}
header nav{display:flex;gap:22px;margin:0 auto;font-size:14px;font-weight:600}header nav a{color:var(--ink);text-decoration:none;opacity:.85}header nav a:hover{color:var(--acc)}
.tools{display:flex;gap:8px;align-items:center}
.pill{border:1px solid var(--line);background:var(--glass);color:var(--ink);padding:8px 14px;border-radius:12px;font:600 13px Manrope,sans-serif;cursor:pointer}
.on-btn{background:#1f9d55;border-color:#1f9d55;color:#fff}.off-btn{background:#d93a3a;border-color:#d93a3a;color:#fff}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:14px;padding:14px 22px;font:700 15px Manrope,sans-serif;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--acc);color:#fff;box-shadow:0 10px 24px rgba(29,91,255,.3)}.btn.ghost{background:var(--glass);color:var(--ink);border:1px solid var(--gb)}
.btn:disabled{opacity:.4;cursor:not-allowed}
main{width:min(1180px,94vw);margin:0 auto}
.hero>*{min-width:0}.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:44px;align-items:center;padding:70px 0 40px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.16em;color:var(--m);text-transform:uppercase;display:flex;gap:12px;align-items:center;margin-bottom:22px}
.orb{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,var(--acc2) 40%,var(--acc) 75%);box-shadow:0 8px 24px rgba(29,91,255,.4),inset 0 -6px 14px rgba(0,0,0,.15);animation:fl 5s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-6px) scale(1.04)}}
h1{font-size:clamp(36px,5vw,60px);line-height:1.08;font-weight:800;letter-spacing:-.02em}h1 span{color:var(--acc)}
.lead{color:var(--m);font-size:17.5px;margin:22px 0 28px;max-width:560px}
.note{color:var(--m);font-size:13px;margin-top:16px}
.chat{padding:18px;display:flex;flex-direction:column;height:520px}
.chat-top{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;padding:4px 6px 14px;border-bottom:1px solid var(--line)}
.dot{width:8px;height:8px;border-radius:50%;background:#1f9d55;box-shadow:0 0 0 4px rgba(31,157,85,.15)}
.msgs{flex:1;overflow:auto;padding:14px 4px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.b{max-width:88%;padding:11px 15px;border-radius:16px;font-size:15px;line-height:1.55;white-space:pre-wrap}
.b.ai{background:rgba(255,255,255,.75);border:1px solid var(--gb);align-self:flex-start;border-bottom-left-radius:6px}
body.dark .b.ai{background:rgba(30,44,80,.8)}
.b.me{background:var(--acc);color:#fff;align-self:flex-end;border-bottom-right-radius:6px}
.b.typing:after{content:"▍";animation:bl 1s steps(2) infinite;color:var(--acc)}@keyframes bl{50%{opacity:0}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 2px 10px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--glass);color:var(--ink);border-radius:999px;padding:7px 13px;font:600 13px Manrope,sans-serif;cursor:pointer}
.chip:hover{border-color:var(--acc);color:var(--acc)}
.ask{display:flex;gap:8px}.ask input{flex:1;border:1px solid var(--line);background:rgba(255,255,255,.7);color:var(--ink);border-radius:14px;padding:13px 15px;font:15px Manrope,sans-serif;outline:none}
body.dark .ask input{background:rgba(10,18,40,.7)}.ask input:focus{border-color:var(--acc)}
.ask button{border:0;background:var(--acc);color:#fff;border-radius:14px;padding:0 18px;font:700 18px Manrope;cursor:pointer}
section.sec{padding:90px 0 20px;text-align:center}
.kick{font-size:12.5px;font-weight:700;letter-spacing:.18em;color:var(--m);text-transform:uppercase;margin-bottom:14px}
h2{font-size:clamp(28px,3.6vw,44px);line-height:1.12;font-weight:800;letter-spacing:-.02em;max-width:820px;margin:0 auto}
.sub{color:var(--m);max-width:720px;margin:18px auto 0;font-size:16.5px}
.grid{display:grid;gap:16px;margin-top:40px;text-align:left}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.card{padding:26px}.card .n{color:var(--acc);font-size:12px;font-weight:700}.card h3{font-size:19px;font-weight:800;margin:14px 0 10px}.card p{color:var(--m);font-size:14.5px}
.price b{display:block;font-size:40px;font-weight:800;color:var(--acc);margin:6px 0 2px}.price .t{font-weight:800;font-size:18px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin-top:44px;text-align:left}.steps div{border-top:1px solid var(--line);padding-top:18px}.steps .n{color:var(--acc);font-size:12px;font-weight:700}.steps h3{font-size:18px;font-weight:800;margin:12px 0 8px}.steps p{color:var(--m);font-size:14.5px}
.wide{padding:34px}.wide .kick{text-align:left}.wide h3{font-size:24px;font-weight:800;margin-bottom:12px}.wide p{color:var(--m)}.wide p+p{margin-top:12px}
.prompts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:40px}
.pc{text-align:left;padding:20px 22px;cursor:pointer;font:600 15px Manrope,sans-serif;color:var(--ink);display:flex;justify-content:space-between;gap:12px;transition:transform .2s}.pc:hover{transform:translateY(-3px);color:var(--acc)}
.voice{display:grid;grid-template-columns:1fr auto;gap:30px;align-items:center;padding:40px;text-align:left;margin-top:40px}
.wave{display:flex;gap:4px;height:46px;align-items:center;margin-top:18px}.wave i{width:5px;border-radius:3px;background:linear-gradient(var(--acc2),var(--acc));animation:w 1.2s ease-in-out infinite}@keyframes w{0%,100%{height:15%}50%{height:100%}}
footer{width:min(1180px,94vw);margin:80px auto 30px;padding:26px 30px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;color:var(--m);font-size:14px}
.r{opacity:0;transform:translateY(26px);transition:opacity .8s,transform .8s}.r.v{opacity:1;transform:none}
.modal{position:fixed;inset:0;background:rgba(5,10,25,.55);display:none;place-items:center;z-index:80;backdrop-filter:blur(6px)}.modal.on{display:grid}
.box{background:var(--bg);color:var(--ink);border:1px solid var(--gb);border-radius:22px;padding:26px;width:min(480px,92vw);box-shadow:var(--sh)}.box h4{font-size:20px;margin-bottom:10px}
#st{color:var(--acc);min-height:1.7em;font-size:14px;font-weight:600}.box .btn{padding:10px 16px;font-size:14px;margin:8px 6px 0 0}.box input{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:10px}
@media(max-width:980px){header nav{display:none}.hero{grid-template-columns:1fr;padding-top:40px}.g4,.steps{grid-template-columns:repeat(2,1fr)}.g3,.prompts{grid-template-columns:1fr}}
@media(max-width:620px){h1{font-size:34px}.eyebrow{flex-wrap:wrap;font-size:11px}.lead{font-size:16px}.g4,.g2,.steps{grid-template-columns:1fr}.chat{height:480px}.voice{grid-template-columns:1fr}header{gap:8px;padding:8px 10px}.logo span.w{display:none}.pill{padding:7px 10px}section.sec{padding-top:70px}}
</style></head><body>
<header class="glass"><a class="logo" href="#top"><span class="mark">E</span><span class="w">ELITE AI</span></a><nav><a href="#power" data-ru="В чём сила" data-en="Strength"></a><a href="#model" data-ru="Модель" data-en="Model"></a><a href="#security" data-ru="Безопасность" data-en="Security"></a><a href="#done" data-ru="Сделано" data-en="Progress"></a><a href="#stage" data-ru="Стадия" data-en="Stage"></a><a href="#ask" data-ru="Вопросы" data-en="Questions"></a></nav><div class="tools"><button id="call" class="pill on-btn" data-ru="Включить" data-en="Turn on"></button><button id="off" class="pill off-btn" data-ru="Отключить" data-en="Turn off"></button><button id="th" class="pill" title="Theme">☾</button><button id="lg" class="pill">EN</button></div></header><main id="top">
<section class="hero"><div><div class="eyebrow"><span class="orb"></span><span data-ru="ELITE AI / ДЕМО ВЕРСИЯ · ЗАПУСК В НОЯБРЕ" data-en="ELITE AI / DEMO VERSION · LAUNCH IN NOVEMBER"></span></div><h1 data-ru="Персональный ассистент &lt;span&gt;премиум класса.&lt;/span&gt;" data-en="A premium class &lt;span&gt;personal assistant.&lt;/span&gt;"></h1><p class="lead" data-ru="Elite AI это не чат бот и не очередной сервис по подписке. Это личный цифровой сотрудник владельца бизнеса, который работает на его собственном домене, на его устройствах и только на него." data-en="Elite AI is not a chatbot and not yet another subscription service. It is a business owner’s personal digital employee that works on the owner’s own domain, on the owner’s devices and for the owner alone."></p><div style="display:flex;gap:10px;flex-wrap:wrap"><a class="btn primary" href="#ask" onclick="setTimeout(()=>document.getElementById('q2').focus(),400)" data-ru="Задать вопрос ↗" data-en="Ask a question ↗"></a><button class="btn ghost" onclick="document.getElementById('call').click()" data-ru="Поговорить голосом ▷" data-en="Talk by voice ▷"></button></div><p class="note" data-ru="Компания Elite · основатели Мариус и Арсен · юридическое лицо в ОАЭ" data-en="Elite · founders Marius and Arsen · legal entity in the UAE"></p></div><div class="glass chat" id="ask"><div class="chat-top"><span class="dot"></span><span data-ru="Elite AI отвечает на вопросы" data-en="Elite AI answers your questions"></span></div><div class="msgs" id="msgs"></div><div class="chips"><button class="chip" data-ru="Это уже готовый продукт?" data-en="Is it a finished product yet?"></button><button class="chip" data-ru="Сколько стоит?" data-en="How much does it cost?"></button><button class="chip" data-ru="Кто основатели?" data-en="Who are the founders?"></button><button class="chip" data-ru="Чем вы отличаетесь?" data-en="What makes you different?"></button><button class="chip" data-ru="Насколько это безопасно?" data-en="How secure is it?"></button><button class="chip" data-ru="Когда запуск?" data-en="When is the launch?"></button></div><form class="ask" id="af"><input id="q2" autocomplete="off" maxlength="600" data-ph-ru="Спросите о платформе…" data-ph-en="Ask about the platform…"><button aria-label="send">↑</button></form></div></section>
<section class="sec r" id="power"><div class="kick" data-ru="В чём сила" data-en="Where its strength lies"></div><h2 data-ru="Сотрудник, который помнит всё и не устаёт." data-en="An employee who remembers everything and never tires."></h2><p class="sub" data-ru="Продукт создан не для массового рынка, а для людей, чьё время стоит дорого: собственников, инвесторов, руководителей." data-en="The product is built not for the mass market but for people whose time is expensive: owners, investors, executives."></p><div class="grid g4"><div class="glass card"><div class="n">01</div><h3 data-ru="Оркестр моделей" data-en="An orchestra of models"></h3><p class="m" data-ru="Elite AI построен как оркестр. Внутри работают от пяти до пятидесяти моделей искусственного интеллекта, и система сама решает, какую из них подключить к конкретной задаче: одну для рассуждений, другую для текста, третью для поиска и анализа. Клиент не выбирает модели и не разбирается в них, он просто говорит с ассистентом." data-en="Elite AI is built like an orchestra. Inside, five to fifty artificial intelligence models work together, and the system itself decides which one to bring to a given task: one for reasoning, another for text, a third for search and analysis. The client does not choose models or need to understand them; they simply talk to the assistant."></p></div><div class="glass card"><div class="n">02</div><h3 data-ru="CRM с человеческим лицом" data-en="A CRM with a human face"></h3><p class="m" data-ru="У каждого ассистента своя CRM система. Она хранит людей, сделки, договорённости и все дела производства, а ассистент сам ведёт их: звонит людям, представляясь помощником владельца, пишет сообщения, готовит документы, напоминает и контролирует сроки." data-en="Every assistant has its own CRM. It holds people, deals, agreements and all operational matters, and the assistant runs them itself: it calls people introducing itself as the owner’s assistant, writes messages, prepares documents, sends reminders and keeps track of deadlines."></p></div><div class="glass card"><div class="n">03</div><h3 data-ru="Исполнитель на вашей технике" data-en="A doer on your hardware"></h3><p class="m" data-ru="Ассистент получает доступ к ноутбуку и другим устройствам владельца. Именно это превращает его из собеседника в исполнителя: он открывает файлы, работает с документами и выполняет поручения на реальной технике клиента." data-en="The assistant gets access to the owner’s laptop and other devices. That is what turns it from a conversation partner into a doer: it opens files, works with documents and carries out tasks on the client’s real hardware."></p></div><div class="glass card"><div class="n">04</div><h3 data-ru="Защищённая связь" data-en="Secure communication"></h3><p class="m" data-ru="Связь с ассистентом идёт через собственный защищённый мессенджер на протоколе Signal, том же, которым защищены Signal и WhatsApp. Сервер хранит только зашифрованные сообщения и не может их прочитать. Владелец звонит ассистенту как обычному человеку и говорит с ним голосом." data-en="Communication runs through its own secure messenger on the Signal protocol, the same one that protects Signal and WhatsApp. The server stores only encrypted messages and cannot read them. The owner calls the assistant like an ordinary person and talks to it by voice."></p></div></div></section>
<section class="sec r" id="model"><div class="kick" data-ru="Уникальность модели" data-en="What makes the model unique"></div><h2 data-ru="Свой экземпляр на своём домене." data-en="Your own instance on your own domain."></h2><p class="sub" data-ru="Каждый клиент получает не учётную запись в общем сервисе, а свой отдельный экземпляр системы на своём домене. Его данные, ключи и память изолированы от других клиентов. Ассистент работает на клиента по лицензии, а продукт не привязан к законам одной страны и рассчитан на работу в любой точке мира." data-en="Each client receives not an account in a shared service but a separate instance of the system on their own domain. Their data, keys and memory are isolated from other clients. The assistant works for the client under a licence, and the product is not tied to the laws of any single country and is designed to work anywhere in the world."></p><div class="grid g4"><div class="glass card price"><div class="n" data-ru="ПОДПИСКА" data-en="SUBSCRIPTION"></div><div class="t" style="margin-top:12px">Private</div><b>$300</b><p class="m" data-ru="в месяц" data-en="per month"></p></div><div class="glass card price"><div class="n" data-ru="ПОДПИСКА" data-en="SUBSCRIPTION"></div><div class="t" style="margin-top:12px">Signature</div><b>$600</b><p class="m" data-ru="в месяц" data-en="per month"></p></div><div class="glass card price"><div class="n" data-ru="ПОДПИСКА" data-en="SUBSCRIPTION"></div><div class="t" style="margin-top:12px">Sovereign</div><b>$900</b><p class="m" data-ru="в месяц" data-en="per month"></p></div><div class="glass card price"><div class="n" data-ru="ВЫКУП" data-en="BUYOUT"></div><div class="t" style="margin-top:12px" data-ru="Выкуп платформы" data-en="Platform buyout"></div><b>$50</b><p class="m" data-ru="в месяц после первого года, а первый год обслуживания и обновлений бесплатный" data-en="per month after the first year; the first year of service and updates is free"></p></div></div></section>
<section class="sec r" id="security"><div class="kick" data-ru="Безопасность и контроль" data-en="Security and control"></div><h2 data-ru="Проверяемые гарантии вместо пустых обещаний." data-en="Verifiable guarantees instead of empty promises."></h2><p class="sub" data-ru="Мы сознательно не называем систему невзламываемой. Деньги, платежи и звонки ассистент не проводит без подтверждения владельца. Права выдаются постепенно: сначала ассистент только читает, затем владелец сам открывает ему новые возможности с порогами по суммам." data-en="We deliberately do not call the system unhackable. The assistant does not move money, make payments or place calls without the owner’s confirmation. Permissions are granted gradually: at first the assistant can only read, then the owner personally opens new capabilities with amount thresholds."></p><div class="steps"><div><div class="n">01</div><h3 data-ru="Изоляция" data-en="Isolation"></h3><p class="m" data-ru="Каждый клиент отделён от остальных." data-en="Every client is separated from the rest."></p></div><div><div class="n">02</div><h3 data-ru="Шифрование ключей" data-en="Key encryption"></h3><p class="m" data-ru="Ключи клиента хранятся в зашифрованном виде." data-en="Client keys are stored encrypted."></p></div><div><div class="n">03</div><h3 data-ru="Неизменяемый журнал" data-en="Immutable log"></h3><p class="m" data-ru="Все действия ассистента записываются без права правки." data-en="Every action of the assistant is recorded and cannot be altered."></p></div><div><div class="n">04</div><h3 data-ru="Аварийный выключатель" data-en="Kill switch"></h3><p class="m" data-ru="Владелец может остановить ассистента в любой момент." data-en="The owner can stop the assistant at any moment."></p></div></div></section>
<section class="sec r" id="done"><div class="kick" data-ru="Что уже сделано" data-en="What has been done"></div><h2 data-ru="Исследование, техническое задание и первая фаза кода." data-en="Research, a specification and the first phase of code."></h2><div class="grid g2"><div class="glass wide"><div class="kick" data-ru="Исследование" data-en="Research"></div><h3 data-ru="72 страницы о рынке и конкурентах" data-en="72 pages on the market and competitors"></h3><p class="m" data-ru="Проведено глобальное исследование рынка и конкурентов объёмом 72 страницы, а также разобран продукт BOB, который 22 октября 2026 года привлёк 5,5 миллиона долларов на схожей идее финансового AI сотрудника. Это подтверждает спрос на рынке. Подготовлено техническое задание. Исследован рынок доменов для массового размещения клиентских экземпляров." data-en="A 72 page global study of the market and competitors has been carried out, and the product BOB, which on 22 October 2026 raised 5.5 million dollars on a similar idea of a financial AI employee, has been analysed. This confirms market demand. A technical specification has been prepared. The domain market has been researched for hosting client instances at scale."></p></div><div class="glass wide"><div class="kick" data-ru="Код" data-en="Code"></div><h3 data-ru="Первая фаза на TypeScript, 17 тестов проходят" data-en="First phase in TypeScript, 17 tests passing"></h3><p class="m" data-ru="Написана первая фаза кода платформы на TypeScript. В ней работают защищённый мессенджер на официальной библиотеке Signal, изоляция клиентов, шифрование ключей, журнал действий, три тарифа, ядро CRM, подключение к ноутбуку с привязкой устройства и ограниченными правами, маршрутизатор моделей и аварийный выключатель. Все 17 автоматических тестов проходят, проверки на утечки секретов и уязвимости чистые." data-en="The first phase of the platform code has been written in TypeScript. It includes a working secure messenger on the official Signal library, client isolation, key encryption, an action log, three tiers, the CRM core, laptop connection with device binding and limited permissions, a model router and a kill switch. All 17 automated tests pass, and the scans for leaked secrets and vulnerabilities are clean."></p></div></div></section>
<section class="sec r" id="stage"><div class="kick" data-ru="Честно о стадии" data-en="Honestly about the stage"></div><h2 data-ru="Рабочий фундамент, а не готовый продукт." data-en="A working foundation, not a finished product."></h2><div class="grid g2"><div class="glass wide"><div class="kick" data-ru="В какой стадии проект" data-en="Where the project stands"></div><h3 data-ru="Что идёт следующим этапом" data-en="What comes next"></h3><p class="m" data-ru="Голосовые звонки, встречи, связь между экземплярами клиентов, подключение собственного домена и реальные модели ИИ пока стоят заглушками и идут следующим этапом. Дальше по плану подключение моделей, хранилище ключей, приложение для компьютера и голосовая связь." data-en="Voice calls, meetings, communication between client instances, custom domain connection and real AI models are still placeholders and come in the next stage. The plan continues with connecting the models, a key vault, a desktop application and voice communication."></p><p class="m" data-ru="Следующими в продукт войдут модуль счетов и оплаты прямо в переписке, первый платёжный провайдер Ziina для ОАЭ, и независимый аудит безопасности кода." data-en="Next into the product come an invoicing and payment module right inside the chat, Ziina as the first payment provider for the UAE, and an independent security audit of the code."></p></div><div class="glass wide"><div class="kick" data-ru="Что нужно проекту" data-en="What the project needs"></div><h3 data-ru="Следующий шаг" data-en="The next step"></h3><p class="m" data-ru="Финансирование команды на доведение до первых платящих клиентов, юридическая проверка лицензии библиотеки Signal для распространения и регистрация товарного знака." data-en="Funding for the team to reach the first paying clients, a legal review of the Signal library licence for distribution, and trademark registration."></p><p class="m" data-ru="Сейчас работает демо версия, запуск запланирован на ноябрь." data-en="A demo version is running now, and launch is planned for November."></p></div></div></section>

<script>
let L=localStorage.getItem('elite-lang')||'ru';const lg=document.getElementById('lg');
const T=()=>{document.querySelectorAll('[data-ru]').forEach(e=>e.innerHTML=e.dataset[L]);document.querySelectorAll('[data-ph-ru]').forEach(e=>e.placeholder=e.dataset['ph'+(L=='ru'?'Ru':'En')]);lg.textContent=L=='ru'?'EN':'RU';document.documentElement.lang=L;localStorage.setItem('elite-lang',L);window.eliteLang&&window.eliteLang(L);window.askGreet&&window.askGreet()};
lg.onclick=()=>{L=L=='ru'?'en':'ru';T()};
(function(){var b=document.getElementById('th'),k='elite-theme';function s(d){document.body.classList.toggle('dark',d);b.textContent=d?'☀':'☾'}s(localStorage.getItem(k)==='dark');b.onclick=function(){var d=!document.body.classList.contains('dark');localStorage.setItem(k,d?'dark':'light');s(d)}})();
for(let i=0;i<40;i++){const b=document.createElement('i');b.style.animationDelay=(Math.sin(i*.7)*.6+.6).toFixed(2)+'s';wv.appendChild(b)}
const o=new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting&&e.target.classList.add('v')),{threshold:.1});document.querySelectorAll('.r').forEach(e=>o.observe(e));
if(location.search.includes('shot'))document.querySelectorAll('.r').forEach(e=>e.classList.add('v'));
// Q&A chat (Grok text, streaming)
const msgs=document.getElementById('msgs'),af=document.getElementById('af'),q2=document.getElementById('q2');let H=[],busyA=false;
const G={ru:"Здравствуйте! Я Elite AI. Спросите меня о платформе: что она умеет, чем отличается, сколько стоит и на какой стадии проект. Компания Elite, основатели Мариус и Арсен, сейчас работает демо версия, запуск в ноябре.",en:"Hello! I am Elite AI. Ask me about the platform: what it does, what sets it apart, what it costs and where the project stands. Elite is the company, founded by Marius and Arsen; this is a demo, and launch is planned for November."};
const bub=(c,t)=>{const d=document.createElement('div');d.className='b '+c;d.textContent=t;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;return d};
window.askGreet=()=>{if(!H.length){msgs.innerHTML='';bub('ai',G[L])}};
async function askQ(q){q=(q||'').trim();if(!q||busyA)return;busyA=true;bub('me',q);H.push({role:'user',content:q});const d=bub('ai typing','');
 try{const r=await fetch(window.ELITE_GATEWAY_URL+'/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lang:L,messages:H.slice(-12)})});
  if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.error?.message||('HTTP '+r.status))}
  const rd=r.body.getReader(),dec=new TextDecoder();let t='';for(;;){const {done,value}=await rd.read();if(done)break;t+=dec.decode(value,{stream:true});d.textContent=t;msgs.scrollTop=msgs.scrollHeight}
  if(!t)throw new Error('empty');H.push({role:'assistant',content:t})}
 catch(e){d.textContent=(L=='ru'?'Не удалось получить ответ, попробуйте ещё раз. ':'Could not get an answer, please try again. ')+(e.message||'');H.pop()}
 d.classList.remove('typing');busyA=false}
af.onsubmit=e=>{e.preventDefault();const v=q2.value;q2.value='';askQ(v)};
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>askQ(c.textContent));
document.querySelectorAll('.pc').forEach(c=>c.onclick=()=>{document.getElementById('ask').scrollIntoView({behavior:'smooth',block:'center'});askQ(c.querySelector('span').textContent)});
T();
</script><script src="voice.js"></script></body></html>
